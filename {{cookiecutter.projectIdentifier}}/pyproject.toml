[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "{{ cookiecutter.projectIdentifier }}"
version = "{{ cookiecutter.version }}"
description = "{{cookiecutter.projectShortDescription}}"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
authors = [
  {name = "{{cookiecutter.fullName}}", email = "{{cookiecutter.email}}"}
]
keywords = ["{{ cookiecutter.packageName }}", "python", "package"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
license = {text = "MIT"}
# Runtime dependencies — none by default. Add them here (pyproject is the source of
# truth); keep version ranges, not pins (this is a library). e.g.:
#   dependencies = ["requests>=2.31"]
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "build",
    "bump2version",
    "mypy",
    "twine",
]

[project.urls]

bugs = "https://github.com/{{cookiecutter.ghIdentifier}}/issues"
changelog = "https://github.com/{{cookiecutter.ghIdentifier}}/blob/prod/HISTORY.md"
homepage = "https://github.com/{{cookiecutter.ghIdentifier}}"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
testpaths = ["tests/*"]
python_functions = ["test*"]
python_files = ["test*.py"]
# src/ layout: let pytest import the package without an install (so `make test` and a
# bare `pytest` work on a fresh checkout).
pythonpath = ["src"]

# Path resolution: the Makefile scopes quality targets via PY_* vars (.env sets
# PY_SRC=src for this src/ layout). The src/files config below is the fallback that
# makes a bare `ruff check .` / `mypy .` (no path args) and IDE integrations resolve
# the same scope. The Makefile is byte-identical across halves.
[tool.ruff]
target-version = "py310"  # support floor; default dev interpreter is 3.13
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

# Multi-repo co-development (RECOMMENDED over the requirements-local.txt overlay).
# Point a dependency at a sibling working tree so one resolver spans both repos during
# dev, while CI/release still resolve the pinned index version. Uncomment and adjust:
#
# [tool.uv.sources]
# my-sibling-lib = { path = "../my-sibling-lib", editable = true }
#
# The dependency itself stays declared (with a version range) under [project]
# dependencies — [tool.uv.sources] only overrides WHERE it resolves from locally.
# See `make sync-local` / `make editable-local` for the gitignored-overlay fallback.