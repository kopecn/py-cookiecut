[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "py-cookiecut"
version = "0.0.2"
description = "Cookiecutter template that match's Nick's workflows"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "Nicholas Bergantz", email = "nicholas.bergantz@gmail.com" },
]
keywords = ["cookiecutter", "template", "package"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development",
]
dependencies = [
    "cookiecutter>=2.6.0",
    "pytest>=8.4.1",
    "pytest-cookies>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "build",
    "bump2version",
    "mypy",
    "twine",
]


[project.urls]
homepage = "https://github.com/kopecn/py-cookiecut"


[tool.pytest.ini_options]
testpaths = ["tests/*"]
python_functions = ["test*"]
python_files = ["test*.py"]

# Config-only path resolution (GAPS §6): this repo's Python lives in hooks/ + tests/
# (no src/). The Makefile is byte-identical across halves, so the per-half path
# difference is expressed here, not in recipe args. `ruff check .` / `mypy .` (no
# path args) resolve scope from this config.
[tool.ruff]
target-version = "py310"  # support floor; default dev interpreter is 3.13
line-length = 100
src = ["hooks", "tests"]

[tool.ruff.lint]
# camelCase is a deliberate house convention ("Nick's workflow") — pep8-naming (N)
# is intentionally omitted so it never fails CI.
select = ["E", "F", "I", "UP", "B"]
# TODO(G5): decide ty (preview type-checker) in/out — owned by Plan 11.

[tool.mypy]
python_version = "3.10"
strict = true
files = ["hooks", "tests"]

# cookiecutter and pytest_cookies ship no py.typed marker / stubs.
[[tool.mypy.overrides]]
module = ["cookiecutter.*", "pytest_cookies.*"]
ignore_missing_imports = true